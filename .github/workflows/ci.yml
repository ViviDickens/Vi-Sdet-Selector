name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Rule engine + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # No API keys in CI, so test_deepeval_reasoning.py skips itself.
      # Everything else is deterministic and runs in well under a second.
      - run: python -m pytest tests/ -v

  typescript:
    name: SDK typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: playwright-sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck
